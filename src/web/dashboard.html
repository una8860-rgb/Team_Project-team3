<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>감지 기록 대시보드</title>
  <link rel="stylesheet" href="dashboard.css" />
  <script>
    // 화면이 그려지기 전에 밝기를 정해서 깜빡임을 막습니다. 저장된 선택이 없으면 컴퓨터 설정을 따릅니다.
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("dda-theme"); } catch (e) {}
      var dark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = saved || (dark ? "dark" : "light");
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/><circle cx="12" cy="10.5" r="2.5"/></svg>
        </span>
        <div>
          <h1>감지 기록</h1>
          <p class="sub">딴짓 보호 로봇 · 사람이 감지된 시각과 횟수</p>
        </div>
      </div>
      <div class="controls">
        <span id="conn" class="conn"></span>
        <label class="date"><span>날짜</span><input type="date" id="date" /></label>
        <button id="big-toggle" class="bar-btn" title="발표용 크게 보기 (Esc 로 나가기)">
          <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
          <span>크게 보기</span>
        </button>
        <button id="theme-toggle" class="bar-btn icon" aria-label="다크 모드 켜기" title="다크 모드">
          <svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></svg>
          <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- 새 감지 알림이 뜨는 자리 -->
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <main class="dash">
    <!-- 숫자 카드: 넓은 화면 4칸, 중간 2칸, 좁은 화면 1칸 -->
    <section class="kpis">
      <article class="kpi hero">
        <header class="kpi-head">
          <span class="kpi-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12c2.2-4 5.4-6 9-6s6.8 2 9 6c-2.2 4-5.4 6-9 6s-6.8-2-9-6z"/><circle cx="12" cy="12" r="2.75"/></svg></span>
          <span class="kpi-label">감지 횟수</span>
        </header>
        <div class="kpi-value" id="kpi-count">-</div>
        <div class="kpi-sub" id="kpi-count-sub"></div>
      </article>
      <article class="kpi" id="kpi-state-card">
        <header class="kpi-head">
          <span class="kpi-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"/><path d="M5.5 19.5c.9-3.2 3.4-5 6.5-5s5.6 1.8 6.5 5"/></svg></span>
          <span class="kpi-label">현재 상태</span>
        </header>
        <div class="kpi-value state" id="kpi-state">-</div>
        <div class="kpi-sub" id="kpi-state-sub"></div>
      </article>
      <article class="kpi">
        <header class="kpi-head">
          <span class="kpi-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></span>
          <span class="kpi-label">마지막 감지</span>
        </header>
        <div class="kpi-value" id="kpi-last">-</div>
        <div class="kpi-sub" id="kpi-last-sub"></div>
      </article>
      <article class="kpi">
        <header class="kpi-head">
          <span class="kpi-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 13.5V10M10 2.5h4M12 2.5V6M18.5 6.5l1.5-1.5"/></svg></span>
          <span class="kpi-label">평균 머문 시간</span>
        </header>
        <div class="kpi-value" id="kpi-stay">-</div>
        <div class="kpi-sub">감지부터 사라질 때까지</div>
      </article>
    </section>

    <!-- 자리 비움 타임라인 -->
    <section class="card">
      <div class="card-head">
        <h2>오늘의 타임라인</h2>
        <span class="card-legend"><i class="swatch"></i>사람이 있던 시간</span>
      </div>
      <div class="chart-wrap">
        <svg id="timeline" role="img" aria-label="하루 동안 사람이 있던 시간 타임라인"></svg>
        <div id="timeline-tip" class="tooltip hidden"></div>
      </div>
      <!-- 오늘 요약 (예전 추가 카드 4개) -->
      <dl class="summary">
        <div><dt>가장 많이 온 시간대</dt><dd id="kpi-peak">-</dd></div>
        <div><dt>가장 오래 머문 시간</dt><dd id="kpi-longest">-</dd></div>
        <div><dt>총 머문 시간</dt><dd id="kpi-total">-</dd></div>
        <div><dt>평균 신뢰도</dt><dd id="kpi-conf">-</dd></div>
      </dl>
    </section>

    <!-- 그래프 두 개 -->
    <section class="charts">
      <div class="card">
        <div class="card-head">
          <h2>시간대별 감지 횟수</h2>
          <span class="card-note">막대에 마우스를 올리면 횟수가 보입니다</span>
        </div>
        <div class="chart-wrap">
          <svg id="chart" role="img" aria-label="시간대별 감지 횟수 막대그래프"></svg>
          <div id="chart-tip" class="tooltip hidden"></div>
        </div>
      </div>
      <div class="card">
        <div class="card-head">
          <h2>최근 7일</h2>
          <span class="card-note">날짜별 감지 횟수</span>
        </div>
        <div class="chart-wrap">
          <svg id="trend" role="img" aria-label="최근 7일 날짜별 감지 횟수 막대그래프"></svg>
          <div id="trend-tip" class="tooltip hidden"></div>
        </div>
      </div>
    </section>

    <!-- 기록 표 -->
    <section class="card table-card">
      <div class="card-head">
        <h2>기록 <span class="card-note" id="table-count"></span></h2>
        <div class="table-tools">
          <div class="seg" role="group" aria-label="기록 필터">
            <button data-filter="all" class="on">전체</button>
            <button data-filter="person_detected">감지만</button>
            <button data-filter="person_left">사라짐만</button>
          </div>
          <button id="csv" class="btn-outline" title="이 날짜 기록을 엑셀에서 열 수 있는 CSV 파일로 받기">
            <svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>엑셀로 내보내기
          </button>
        </div>
      </div>
      <div class="table-wrap">
        <table class="log">
          <thead><tr><th>번호</th><th>종류</th><th>시각</th><th class="num">신뢰도</th><th class="num">머문 시간</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p id="empty" class="empty hidden">이 날짜에는 기록이 없습니다.</p>
      <nav id="pager" class="pager" aria-label="기록 페이지"></nav>
    </section>

    <p class="foot" id="updated"></p>
  </main>

  <script src="config.js"></script>
  <script src="dashboard-charts.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
